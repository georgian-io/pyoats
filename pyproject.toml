[project]
name = "pyoats"
version = "0.2.0"
description = "Quick and Easy Time Series Outlier Detection"
authors = [
    {name = "Benjamin Ye", email = "benjamin.ye@georgian.io"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.9, <3.13"
dependencies = [
    "darts==0.28.0",
    "statsmodels>=0.14.1,<0.15.0",
    "pyod>=2.0.0,<3.0.0",
    "stumpy>=1.12.0,<2.0.0",
    "jenkspy>=0.4.1,<0.5.0",
    "optuna>=2.10.1,<3.0.0",
    "statsforecast>=1.7.3,<2.0.0",
    "lightgbm>=4.3.0,<5.0.0",
    "numpy>=1.26.4",
    "scipy>=1.12.0,<2.0.0",
    "tensorflow>=2.19.0,<2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "black>=24.3.0,<25.0.0",
    "ruff>=0.8.0,<0.9.0",
    "Sphinx>=5.3.0,<6.0.0",
    "pydata-sphinx-theme>=0.10.1,<0.11.0",
    "myst-parser>=0.18.1,<0.19.0",
    "pillow>=10.3.0,<11.0.0",
    "idna>=3.7,<4.0",
    "werkzeug>=3.0.3,<4.0.0",
    "aiohttp>=3.9.4,<4.0.0",
    "jinja2>=3.1.4,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oats"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["oats"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), and isort (I) by default
select = ["E", "F", "I"]
# Ignore common issues in scientific code
ignore = [
    "E501",  # line too long (handled by black)
    "E402",  # module level import not at top of file
    "E712",  # comparison to True/False
    "E731",  # do not assign a lambda expression, use a def
    "E741",  # ambiguous variable name (common in math: l, O, I, etc.)
    "F403",  # unable to detect undefined names from star imports
    "F405",  # may be undefined, or defined from star imports
    "F401",  # imported but unused (in __init__.py files, used for re-export)
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
