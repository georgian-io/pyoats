[project]
name = "pyoats"
version = "0.1.3"
description = "Quick and Easy Time Series Outlier Detection"
authors = [
    {name = "Benjamin Ye", email = "benjamin.ye@georgian.io"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.9, <3.13"
dependencies = [
    "darts==0.28.0",
    "statsmodels>=0.14.1,<0.15.0",
    "pyod>=2.0.0,<3.0.0",
    "stumpy>=1.12.0,<2.0.0",
    "jenkspy>=0.4.1,<0.5.0",
    "optuna>=2.10.1,<3.0.0",
    "statsforecast>=1.7.3,<2.0.0",
    "lightgbm>=4.3.0,<5.0.0",
    "numpy>=1.26.4,<2.0.0",
    "scipy>=1.12.0,<2.0.0",
    "tensorflow>=2.15.0; sys_platform != 'darwin'",
    "tensorflow-macos>=2.15.0; sys_platform == 'darwin'",
    "tensorflow-metal>=1.2.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4,<8.0.0",
    "black>=24.3.0,<25.0.0",
    "pylint>=2.17.7,<3.0.0",
    "Sphinx>=5.3.0,<6.0.0",
    "pydata-sphinx-theme>=0.10.1,<0.11.0",
    "myst-parser>=0.18.1,<0.19.0",
    "pillow>=10.3.0,<11.0.0",
    "idna>=3.7,<4.0",
    "werkzeug>=3.0.3,<4.0.0",
    "aiohttp>=3.9.4,<4.0.0",
    "jinja2>=3.1.4,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oats"]
